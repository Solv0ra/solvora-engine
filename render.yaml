# Render Blueprint — Solvora Engine
# Import: https://render.com/import
# Creates a free-tier web service preconfigured with build/start commands and env vars.

services:
  - type: web
    name: solvora-engine
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: ENTITY_REGISTRY_ADDRESS
        sync: false
      - key: ATTESTATION_ADDRESS
        sync: false
      - key: DATABASE_URL
        value: file:./dev.db
        sync: false
healthCheckPath: /health
